[dev]
command = "npm run dev"
framework = "astro"

[build]
command = "npm run build"
publish = "dist"

# Netlify serves .webmanifest as application/octet-stream by default.
[[headers]]
for = "/favicons/site.webmanifest"
[headers.values]
Content-Type = "application/manifest+json"

# Build output under /_astro/ carries a content hash in the file name, so it can be cached
# for good; any change ships under a new name. Without this Netlify sends max-age=0 and
# every visit revalidates fonts, CSS and images before using them.
[[headers]]
for = "/_astro/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# Baseline security headers for a static site (HSTS is set by Netlify itself).
[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"
