name: Check for Broken Links

# lychee on every built page. Netlify deploys without waiting for it: a broken link flags the
# commit, and the run's summary lists it.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lychee-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Check links in dist/
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          # Pages only: the feed and sitemaps hold XML namespaces and escaped markup that read as
          # broken links. --root-dir resolves the links that start with /. LinkedIn, X's share
          # links and Oxford University Press turn automated requests away, so they would fail
          # every run although they work for readers.
          args: >-
            --verbose
            --no-progress
            --extensions html
            --root-dir ${{ github.workspace }}/dist
            --exclude 'linkedin\.com'
            --exclude 'twitter\.com/intent/'
            --exclude 'doi\.org/10\.1093/'
            -- ./dist
