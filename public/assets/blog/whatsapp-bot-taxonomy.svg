<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" role="img" aria-labelledby="title desc">
  <title id="title">One taxonomy tree, three consumers</title>
  <desc id="desc">The Python taxonomy tree feeds a generator that emits one Flow JSON per language for WhatsApp, a check script run by hand before each publish, and the runtime route validation and contractor mapping used by the outbox.</desc>
  <style>
    .box { fill: #171717; stroke: #404040; stroke-width: 1; }
    .box-accent { fill: #171717; stroke: #38bdf8; stroke-width: 1.2; }
    .t { font: 600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #e5e5e5; }
    .s { font: 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #a3a3a3; }
    .m { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #38bdf8; }
    .arrow { stroke: #38bdf8; stroke-width: 1.4; fill: none; }
    .arrow-dim { stroke: #737373; stroke-width: 1.2; fill: none; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#38bdf8" />
    </marker>
    <marker id="ahd" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#737373" />
    </marker>
  </defs>

  <!-- source of truth -->
  <rect class="box-accent" x="150" y="24" width="460" height="60" rx="8" />
  <text class="t" x="380" y="48" text-anchor="middle">The taxonomy tree, in Python</text>
  <text class="m" x="380" y="70" text-anchor="middle">group("container", [group("damaged", fractions()), ...])</text>

  <!-- three consumers -->
  <rect class="box" x="30" y="150" width="210" height="60" rx="8" />
  <text class="t" x="135" y="174" text-anchor="middle">Flow generator</text>
  <text class="s" x="135" y="194" text-anchor="middle">one Flow JSON per language</text>

  <rect class="box" x="275" y="150" width="210" height="60" rx="8" />
  <text class="t" x="380" y="174" text-anchor="middle">Check script</text>
  <text class="s" x="380" y="194" text-anchor="middle">labels, prompts, limits, mapping</text>

  <rect class="box" x="520" y="150" width="210" height="60" rx="8" />
  <text class="t" x="625" y="174" text-anchor="middle">Runtime</text>
  <text class="s" x="625" y="194" text-anchor="middle">validate the route, map to the contractor</text>

  <path class="arrow" d="M 280 84 L 150 150" marker-end="url(#ah)" />
  <path class="arrow" d="M 380 84 L 380 150" marker-end="url(#ah)" />
  <path class="arrow" d="M 480 84 L 610 150" marker-end="url(#ah)" />

  <!-- destinations -->
  <rect class="box" x="30" y="250" width="210" height="44" rx="8" />
  <text class="t" x="135" y="277" text-anchor="middle">WhatsApp: published Flows</text>
  <text class="s" x="380" y="277" text-anchor="middle">run by hand before every publish</text>
  <rect class="box" x="520" y="250" width="210" height="44" rx="8" />
  <text class="t" x="625" y="277" text-anchor="middle">Contractor's taxonomy</text>

  <path class="arrow-dim" d="M 135 210 L 135 250" marker-end="url(#ahd)" />
  <path class="arrow-dim" d="M 625 210 L 625 250" marker-end="url(#ahd)" />
</svg>
