<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-labelledby="title desc">
  <title id="title">One symptom, three populations, three different correct answers, then a foreign key</title>
  <desc id="desc">5,859 shift reports rendered with a blank road name, because the communications table had no foreign key to roads. The rows split into three populations with different causes and different remedies. Group one, 3,185 rows, was ingested against the road catalogue as it stood before re-segmentation and later re-inserted under the current mapping, so a good copy already exists and the orphans are moved to a backup table; verification recorded 7,545 rows against 7,540 in the desktop system. Group two, 845 rows, lost its road when the original migration dropped one catalogue row, 340 roads in the desktop system against 339 in the web, so restoring the parent row resolves all 845 without touching them. Group three, 1,829 rows, was written once by telemetry against the old catalogue with no good copy anywhere, so it is remapped in place through a 152-pair old-to-new lookup with previous values saved for the rollback. Only then is the foreign key added, with ON DELETE NO ACTION, so deleting a referenced road fails loudly and the API turns the violation into a 409.</desc>
  <style>
    .lane { fill: #0f0f0f; stroke: #333333; stroke-width: 1; }
    .box { fill: #171717; stroke: #404040; stroke-width: 1; }
    .box-accent { fill: #171717; stroke: #38bdf8; stroke-width: 1.2; }
    .inner { fill: #262626; stroke: #404040; stroke-width: 1; }
    .verb-box { fill: #1e293b; stroke: #38bdf8; stroke-width: 1.2; }
    .t { font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #e5e5e5; }
    .s { font: 10.5px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #a3a3a3; }
    .k { font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #38bdf8; }
    .verb { font: 700 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #38bdf8; letter-spacing: 0.4px; }
    .lbl { font: 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #d4d4d4; }
    .mono { font: 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #d4d4d4; }
    .warn { fill: #fbbf24; }
    .arrow { stroke: #38bdf8; stroke-width: 1.4; fill: none; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Symptom -->
  <rect class="box-accent" x="14" y="16" width="772" height="54" rx="10" />
  <text class="k" x="28" y="40">One symptom</text>
  <text class="s" x="126" y="40">5,859 rows rendering with a blank road name, one of them dropped entirely by an inner join</text>
  <text class="warn s" x="28" y="59">The communications table had foreign keys to zones, states, tasks and silos, but never one to roads.</text>

  <path class="arrow" d="M 138 70 L 138 100" marker-end="url(#ah)" />
  <path class="arrow" d="M 400 70 L 400 100" marker-end="url(#ah)" />
  <path class="arrow" d="M 662 70 L 662 100" marker-end="url(#ah)" />

  <!-- Group 1 -->
  <rect class="lane" x="14" y="100" width="248" height="278" rx="10" />
  <text class="k" x="28" y="124">1 · 3,185 rows</text>

  <rect class="inner" x="28" y="136" width="220" height="80" rx="6" />
  <text class="t" x="40" y="154">Cause</text>
  <text class="s" x="40" y="171">ingested against the catalogue as</text>
  <text class="s" x="40" y="184">it stood before re-segmentation,</text>
  <text class="s" x="40" y="197">then re-inserted under the new one</text>

  <rect class="verb-box" x="28" y="226" width="220" height="46" rx="6" />
  <text class="verb" x="40" y="246">DELETE</text>
  <text class="s" x="40" y="263">a good copy already exists</text>

  <rect class="inner" x="28" y="282" width="220" height="80" rx="6" />
  <text class="t" x="40" y="300">How</text>
  <text class="s" x="40" y="317">moved to a backup table, never</text>
  <text class="s" x="40" y="330">destroyed; afterwards 7,545 against</text>
  <text class="s" x="40" y="343">7,540 in the desktop system</text>

  <!-- Group 2 -->
  <rect class="lane" x="276" y="100" width="248" height="278" rx="10" />
  <text class="k" x="290" y="124">2 · 845 rows</text>

  <rect class="inner" x="290" y="136" width="220" height="80" rx="6" />
  <text class="t" x="302" y="154">Cause</text>
  <text class="s" x="302" y="171">their road vanished in the original</text>
  <text class="s" x="302" y="184">migration: the desktop system holds</text>
  <text class="s" x="302" y="197">340 roads that season, the web 339</text>

  <rect class="verb-box" x="290" y="226" width="220" height="46" rx="6" />
  <text class="verb" x="302" y="246">RESTORE THE PARENT</text>
  <text class="s" x="302" y="263">content would be lost otherwise</text>

  <rect class="inner" x="290" y="282" width="220" height="80" rx="6" />
  <text class="t" x="302" y="300">How</text>
  <text class="s" x="302" y="317">one guarded insert re-creates the</text>
  <text class="s" x="302" y="330">catalogue row; the 845 are never</text>
  <text class="s" x="302" y="343">touched and resolve on their own</text>

  <!-- Group 3 -->
  <rect class="lane" x="538" y="100" width="248" height="278" rx="10" />
  <text class="k" x="552" y="124">3 · 1,829 rows</text>

  <rect class="inner" x="552" y="136" width="220" height="80" rx="6" />
  <text class="t" x="564" y="154">Cause</text>
  <text class="s" x="564" y="171">written once by telemetry against</text>
  <text class="s" x="564" y="184">the old catalogue; native to the</text>
  <text class="s" x="564" y="197">web, with no good copy anywhere</text>

  <rect class="verb-box" x="552" y="226" width="220" height="46" rx="6" />
  <text class="verb" x="564" y="246">REMAP IN PLACE</text>
  <text class="s" x="564" y="263">unique rows, mapping is deterministic</text>

  <rect class="inner" x="552" y="282" width="220" height="80" rx="6" />
  <text class="t" x="564" y="300">How</text>
  <text class="s" x="564" y="317">a 152-pair old-to-new lookup baked</text>
  <text class="s" x="564" y="330">into the migration; old values kept</text>
  <text class="s" x="564" y="343">so the rollback can restore them</text>

  <!-- Then the FK -->
  <path class="arrow" d="M 400 378 L 400 402" marker-end="url(#ah)" />
  <rect class="box-accent" x="14" y="406" width="772" height="50" rx="10" />
  <text class="k" x="28" y="428">Only then, the foreign key</text>
  <text class="s" x="204" y="428">about two dozen lines, once nothing is left to violate it</text>
  <text class="mono" x="28" y="447">ON DELETE NO ACTION</text>
  <text class="s" x="166" y="447">deleting a referenced road now fails loudly, and the API turns the violation into a 409.</text>
</svg>
