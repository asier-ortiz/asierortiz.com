<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="title desc">
  <title id="title">One file, two claims, four pieces of evidence, three verdicts</title>
  <desc id="desc">A CSV file carries two claims about its station: the folder says station B and the export header code maps to station A; the sensor code in the filename is recorded but not read as a claim. Four pieces of evidence are weighed: the hydrochemical fingerprint with its confidence, the header code, the controller serial, and whether the suggested station has a coverage gap that month. Two or more pieces give a relocation suggestion, a lone profile or serial match gives a review with a suggested station, anything less gives a manual review. In every case the file stays out of the consolidation until a person decides.</desc>
  <style>
    .box { fill: #171717; stroke: #404040; stroke-width: 1; }
    .box-accent { fill: #171717; stroke: #38bdf8; stroke-width: 1.2; }
    .inner { fill: #262626; stroke: #404040; stroke-width: 1; }
    .t { font: 600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #e5e5e5; }
    .s { font: 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #a3a3a3; }
    .k { font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #38bdf8; }
    .lbl { font: 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #d4d4d4; }
    .mono { font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #d4d4d4; }
    .warn { fill: #fbbf24; }
    .arrow { stroke: #38bdf8; stroke-width: 1.4; fill: none; }
    .arrow-dim { stroke: #737373; stroke-width: 1.2; fill: none; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#38bdf8" />
    </marker>
    <marker id="ahd" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#737373" />
    </marker>
  </defs>

  <!-- Column titles -->
  <text class="k" x="20" y="30">The file</text>
  <text class="k" x="300" y="30">The evidence</text>
  <text class="k" x="590" y="30">The verdict</text>

  <!-- The file -->
  <rect class="box" x="20" y="44" width="240" height="250" rx="10" />
  <text class="mono" x="32" y="66">2020-07_S07_COND.csv</text>
  <rect class="inner" x="32" y="80" width="216" height="44" rx="6" />
  <text class="lbl" x="44" y="98">Folder</text>
  <text class="s" x="44" y="114">STATION B</text>
  <rect class="inner" x="32" y="132" width="216" height="44" rx="6" />
  <text class="lbl" x="44" y="150">Filename: sensor code S07, no station name</text>
  <text class="s" x="44" y="166">recorded, not read as a claim</text>
  <rect class="inner" x="32" y="184" width="216" height="44" rx="6" />
  <text class="lbl" x="44" y="202">Export header LOCATION: S07</text>
  <text class="s" x="44" y="218">maps to STATION A</text>
  <rect class="inner" x="32" y="236" width="216" height="44" rx="6" />
  <text class="lbl" x="44" y="254">Workbook tab</text>
  <text class="s" x="44" y="270">none, this is a CSV</text>
  <text class="s warn" x="140" y="316" text-anchor="middle">two claims, two different stations</text>
  <text class="s warn" x="140" y="332" text-anchor="middle">→ identity discrepancy</text>

  <!-- arrow file -> evidence -->
  <path class="arrow" d="M 260 170 L 300 170" marker-end="url(#ah)" />

  <!-- The evidence -->
  <rect class="box-accent" x="300" y="44" width="250" height="322" rx="10" />
  <rect class="inner" x="312" y="58" width="226" height="76" rx="6" />
  <text class="lbl" x="324" y="76">1. Hydrochemical fingerprint</text>
  <text class="s" x="324" y="92">distance to each station's profile,</text>
  <text class="s" x="324" y="106">in standard deviations</text>
  <text class="s" x="324" y="122">confidence = 2nd best ÷ best</text>
  <rect class="inner" x="312" y="142" width="226" height="44" rx="6" />
  <text class="lbl" x="324" y="160">2. Header code</text>
  <text class="s" x="324" y="176">does it map to the suggested station?</text>
  <rect class="inner" x="312" y="194" width="226" height="44" rx="6" />
  <text class="lbl" x="324" y="212">3. Controller serial</text>
  <text class="s" x="324" y="228">seen in the target station's files?</text>
  <rect class="inner" x="312" y="246" width="226" height="44" rx="6" />
  <text class="lbl" x="324" y="264">4. Coverage gap</text>
  <text class="s" x="324" y="280">is the target station empty that month?</text>
  <text class="s" x="425" y="316" text-anchor="middle">each piece counts one</text>
  <text class="s" x="425" y="332" text-anchor="middle">only when it agrees with the fingerprint</text>
  <text class="s warn" x="425" y="352" text-anchor="middle">one parameter still counts as one</text>

  <!-- arrow evidence -> verdict -->
  <path class="arrow" d="M 550 170 L 590 170" marker-end="url(#ah)" />

  <!-- The verdict -->
  <rect class="box" x="590" y="44" width="190" height="250" rx="10" />
  <rect class="inner" x="602" y="58" width="166" height="60" rx="6" />
  <text class="k" x="614" y="76">2 or more pieces</text>
  <text class="lbl" x="614" y="92">Relocate to X</text>
  <text class="s" x="614" y="108">a suggestion, pending review</text>
  <rect class="inner" x="602" y="128" width="166" height="60" rx="6" />
  <text class="k" x="614" y="146">profile or serial alone</text>
  <text class="lbl" x="614" y="162">Review: profile suggests X</text>
  <text class="s" x="614" y="178">a person compares the series</text>
  <rect class="inner" x="602" y="198" width="166" height="60" rx="6" />
  <text class="k" x="614" y="216">anything less</text>
  <text class="lbl" x="614" y="232">Review manually</text>
  <text class="s" x="614" y="248">no suggested station</text>
  <text class="s" x="685" y="280" text-anchor="middle">written into the report</text>

  <!-- Bottom note -->
  <rect class="box" x="20" y="384" width="760" height="40" rx="8" />
  <text class="lbl" x="400" y="409" text-anchor="middle">In all three cases the file is excluded from the consolidation. The pipeline suggests a move; it never performs one.</text>
</svg>
