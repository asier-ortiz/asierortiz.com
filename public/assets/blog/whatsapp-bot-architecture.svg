<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-labelledby="title desc">
  <title id="title">Architecture of the citizen reporting bot</title>
  <desc id="desc">WhatsApp posts signed webhooks to an API process that inserts them into PostgreSQL. A worker process claims events from the queue table, keeps per-chat locks and report state in the same database, and makes every outbound call: replies and photo downloads through the Graph API, geocoding through CartoCiudad, and the push into the contractor's platform.</desc>
  <style>
    .box { fill: #171717; stroke: #404040; stroke-width: 1; }
    .box-accent { fill: #171717; stroke: #38bdf8; stroke-width: 1.2; }
    .inner { fill: #262626; stroke: #404040; stroke-width: 1; }
    .t { font: 600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #e5e5e5; }
    .s { font: 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #a3a3a3; }
    .k { font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #38bdf8; }
    .lbl { font: 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #d4d4d4; }
    .arrow { stroke: #38bdf8; stroke-width: 1.4; fill: none; }
    .arrow-dim { stroke: #737373; stroke-width: 1.2; fill: none; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#38bdf8" />
    </marker>
    <marker id="ahd" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#737373" />
    </marker>
  </defs>

  <!-- WhatsApp -->
  <rect class="box" x="20" y="70" width="150" height="64" rx="8" />
  <text class="t" x="95" y="96" text-anchor="middle">WhatsApp Cloud API</text>
  <text class="s" x="95" y="116" text-anchor="middle">the citizen's chat</text>

  <!-- API process -->
  <rect class="box-accent" x="250" y="70" width="160" height="64" rx="8" />
  <text class="t" x="330" y="96" text-anchor="middle">API process</text>
  <text class="s" x="330" y="116" text-anchor="middle">verify signature, insert, 200</text>

  <!-- Worker process -->
  <rect class="box-accent" x="250" y="230" width="160" height="64" rx="8" />
  <text class="t" x="330" y="256" text-anchor="middle">Worker process</text>
  <text class="s" x="330" y="276" text-anchor="middle">one event at a time</text>

  <!-- PostgreSQL -->
  <rect class="box" x="540" y="40" width="245" height="290" rx="10" />
  <text class="k" x="552" y="64">PostgreSQL</text>
  <rect class="inner" x="552" y="80" width="222" height="44" rx="6" />
  <text class="lbl" x="564" y="98">inbound_event: the queue</text>
  <text class="s" x="564" y="114">claim, retry, dead letter</text>
  <rect class="inner" x="552" y="136" width="222" height="44" rx="6" />
  <text class="lbl" x="564" y="154">message ids and chat locks</text>
  <text class="s" x="564" y="170">dedup and per-citizen exclusion</text>
  <rect class="inner" x="552" y="192" width="222" height="44" rx="6" />
  <text class="lbl" x="564" y="210">report rows with outbox columns</text>
  <text class="s" x="564" y="226">draft, received; pending, sent, review, dead</text>
  <rect class="inner" x="552" y="248" width="222" height="44" rx="6" />
  <text class="lbl" x="564" y="266">service-area polygon</text>
  <text class="s" x="564" y="282">PostGIS coverage gate</text>

  <!-- arrows: inbound -->
  <path class="arrow" d="M 170 102 L 250 102" marker-end="url(#ah)" />
  <text class="s" x="210" y="92" text-anchor="middle">signed POST</text>
  <text class="s" x="210" y="122" text-anchor="middle">200 in ms</text>
  <path class="arrow" d="M 410 102 L 552 102" marker-end="url(#ah)" />
  <text class="s" x="481" y="92" text-anchor="middle">INSERT raw body</text>

  <!-- arrows: worker and database -->
  <path class="arrow" d="M 552 262 L 410 262" marker-end="url(#ah)" />
  <text class="s" x="481" y="252" text-anchor="middle">claim, SKIP LOCKED</text>
  <path class="arrow" d="M 410 284 L 552 284" marker-end="url(#ah)" />
  <text class="s" x="481" y="300" text-anchor="middle">lock, state, ack, outbox</text>

  <!-- outbound row -->
  <rect class="box" x="20" y="390" width="200" height="56" rx="8" />
  <text class="t" x="120" y="413" text-anchor="middle">Graph API</text>
  <text class="s" x="120" y="431" text-anchor="middle">replies, photo downloads</text>
  <rect class="box" x="250" y="390" width="160" height="56" rx="8" />
  <text class="t" x="330" y="413" text-anchor="middle">CartoCiudad</text>
  <text class="s" x="330" y="431" text-anchor="middle">geocoding</text>
  <rect class="box" x="440" y="390" width="230" height="56" rx="8" />
  <text class="t" x="555" y="413" text-anchor="middle">Contractor's platform</text>
  <text class="s" x="555" y="431" text-anchor="middle">push, with a review state for doubt</text>

  <path class="arrow-dim" d="M 300 294 L 140 390" marker-end="url(#ahd)" />
  <path class="arrow-dim" d="M 330 294 L 330 390" marker-end="url(#ahd)" />
  <path class="arrow-dim" d="M 360 294 L 520 390" marker-end="url(#ahd)" />
  <text class="s" x="330" y="352" text-anchor="middle">every outbound call leaves from the worker</text>
</svg>
